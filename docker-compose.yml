services:
  redis:
    image: redis:7-alpine
    container_name: amas-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: amas-backend
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: local
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_RELOAD: "true"
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-chroma:/app/app/rag/chroma_db
      - backend-turn-chroma:/app/app/rag/chroma_db_turns
      - backend-uploads:/app/app/rag/uploads
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: amas-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  redis-data:
  backend-chroma:
  backend-turn-chroma:
  backend-uploads:
  frontend-node-modules:
